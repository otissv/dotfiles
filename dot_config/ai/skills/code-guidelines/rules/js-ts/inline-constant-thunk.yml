id: inline-constant-thunk.ts
language: typescript
message: Constant wrapped in a function with no parameters. Use the value and change calls f() to f. See guideline inline-constant-thunk.
severity: warning
metadata:
  autofix: assisted
  guideline: inline-constant-thunk
# Block-body pattern must come before the expression-body one: constraints are checked
# after the first matching pattern, so the expression pattern would claim block bodies.
rule:
  any:
    - pattern: "const $F = () => { return $L }"
    - pattern: const $F = () => $L
    - pattern: "function $F() { return $L }"
  not:
    inside:
      kind: export_statement
constraints:
  L:
    any:
      - kind: number
      - kind: string
      - kind: "true"
      - kind: "false"
      - kind: "null"
      - kind: undefined
fix: const $F = $L;
